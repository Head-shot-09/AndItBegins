<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <form action="index.php" meathod="POST" enctype="multipart/form-data">

            <label for="Username" >Username:</label>
            <input type="text" id="Username" minlength="6" maxlength="16" placeholder="name" required><br>

            
            <label for="Password">Password:</label>
            <input type="password" id="Password" minlength="6" ><br>


            <label for="email">Email:</label>
            <input type="email" id="email" ><br>

            <label for="phone" >Phone:</label>
            <input type="tel" id="phone"  pattern="[0-9]{10}"><br>


            <label for="bday" >Birthdate:</label>
            <input type="date" id="bday" ><br>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" max="99" ><br>

            <label for="Title" >Title:</label>
            
            <label for="Mr." >Mr.</label>
            <input type="radio" id="Mr." value="Mr." name="Title">

            <label for="Ms." >Ms.</label>
            <input type="radio" id="Ms." value="Ms." name="Title">

            <label for="phD." >phD.</label>
            <input type="radio" id="phD." value="phD." name="Title"><br>

            <label for="payment" >Payment:</label>
            <select id="payment">
                <option value="visa" >Visa</option>
                <option value="Mastercard">Mastercard</option>
                <option value="Giftcard">Giftcard</option>
            </select><br>

            <label for="sub" >Subscribe:</label>
            <input type="checkbox" id="sub">
            <br>
             
            <label for="comment" >Comment:</label>
            <textarea id="comment" row="3" cols="25"></textarea><br>

 
            <input type="submit"><br>
            <input type="reset"><br>
            <label for="file" >Choose File:</label>
            <input type="file" id="file" accept="image/png, image/jpeg">
        </form>
    </body>
</html>
